<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Calendar with Events</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="calendar-wrapper">
        <div class="calendar-header">
          <button class="nav-btn" id="prevMonth">&lt;</button>
          <div class="month-title" id="monthTitle"></div>
          <button class="nav-btn" id="nextMonth">&gt;</button>
        </div>
        <div class="selected-date" id="selectedDate">Select a date</div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
    </div>
    <div class="modal" id="eventModal">
      <div class="modal-content">
        <h3>Add Event</h3>
        <input type="text" id="eventText" placeholder="Event description" />
        <button id="saveEvent">Save</button>
        <button id="deleteEvent">Delete</button>
        <button id="closeModal">Cancel</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
